name: Bug report
description: Report a reproducible Activity Journal problem using sanitized information.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real databases, DPAPI material, tokens, or screenshots containing private titles, domains, or paths.
        Report security vulnerabilities privately from the repository Security tab.
  - type: input
    id: version
    attributes:
      label: Activity Journal version
      placeholder: 0.4.2
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 10 22H2 x64
        - Windows 11 x64
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe expected and actual behavior without including sensitive activity data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove usernames, paths, titles, domains, tokens, and activity metadata before pasting logs.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal activity data and secrets from this report.
          required: true
