name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HUSKY: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript quality gate
        run: npm run check

      - name: Test Windows helper
        run: npm run test:helper

      - name: Build renderer and Electron processes
        run: npm run build

      - name: Publish self-contained Windows helper
        run: npm run build:helper
